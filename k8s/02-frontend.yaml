# ---------------------------------------------------------------------------
# The nginx pod that serves the built React app and proxies /api to the backend.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: search-exe
  labels:
    app.kubernetes.io/name: search-exe
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: search-exe
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-exe
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101     # the nginx user in the nginx-unprivileged image
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: search-exe-frontend:0.2.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            # In-cluster DNS: "backend" resolves to the backend Service in this
            # namespace (in full, backend.search-exe.svc.cluster.local). This is
            # service discovery - no addresses are baked into the image, which is
            # why the same image runs here and under compose.
            - name: BACKEND_URL
              value: http://backend:5000

          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          # Serving static files has no external dependency, so liveness and
          # readiness ask the same question here. They are still both declared,
          # because they cause different actions: restart versus remove from the
          # load balancer.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # nginx genuinely needs to write in three places, and with a read-only
          # root filesystem each one has to be given to it explicitly:
          volumeMounts:
            # The entrypoint renders nginx.conf.template into here at startup.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}

      terminationGracePeriodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: search-exe
  labels:
    app.kubernetes.io/name: search-exe
    app.kubernetes.io/component: frontend
spec:
  # Still ClusterIP: the Ingress is what exposes this to the outside world.
  # Using type: LoadBalancer here instead would ask the cloud provider for a
  # dedicated load balancer per service, which gets expensive quickly.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: search-exe
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
