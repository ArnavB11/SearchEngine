# ---------------------------------------------------------------------------
# The single public entrance to the cluster.
#
# An Ingress is HTTP-aware (layer 7), so one load balancer and one IP address can
# route by hostname and path to many Services. The alternative - a
# type: LoadBalancer Service per app - means a cloud load balancer, and a bill,
# for each one.
#
# An Ingress object on its own does nothing: it is a rule that an ingress
# CONTROLLER running in the cluster reads and acts on. On minikube:
#     minikube addons enable ingress
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-exe
  namespace: search-exe
  labels:
    app.kubernetes.io/name: search-exe
spec:
  # Which controller should pick this up. A cluster can run several.
  ingressClassName: nginx

  rules:
    - host: search-exe.local
      http:
        paths:
          # Everything goes to the frontend, which serves the app and proxies
          # /api onward itself.
          #
          # Routing /api straight to the backend Service here would work too, and
          # would be the better choice if a mobile client also called the API.
          # Keeping it in one place means the container behaves identically under
          # compose, where there is no ingress controller at all.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
